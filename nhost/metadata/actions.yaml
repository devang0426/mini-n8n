actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: {{ACTION_BASE_URL}}/api/actions/trigger-workflow
      forward_client_headers: false
      arguments:
        - name: workflow_id
          type: uuid!
      output_type: TriggerWorkflowOutput
    permissions:
      - role: user
      - role: editor
      - role: owner
  - name: approveStep
    definition:
      kind: synchronous
      handler: {{ACTION_BASE_URL}}/api/actions/approve-step
      forward_client_headers: false
      arguments:
        - name: workflow_run_id
          type: uuid!
        - name: step_run_id
          type: uuid!
        - name: approved
          type: Boolean!
      output_type: ApproveStepOutput
    permissions:
      - role: user
      - role: editor
      - role: owner
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowOutput
      fields:
        - name: success
          type: Boolean!
        - name: workflow_run_id
          type: String
        - name: status
          type: String
        - name: error
          type: String
        - name: message
          type: String
    - name: ApproveStepOutput
      fields:
        - name: success
          type: Boolean!
        - name: workflow_run_id
          type: String
        - name: step_run_id
          type: String
        - name: status
          type: String
        - name: error
          type: String
        - name: message
          type: String
  scalars: []
